  - name: IberiaBank Corporation
    type: completed
    closed: '2020-07-01'
    value-usd-billions: ~3.9
    notes: >-
      All-stock merger of equals; combined entity rebranded as First Horizon
      Corporation with roughly $79B in pro forma assets at close.
  - name: Toronto-Dominion Bank (TD)
    type: terminated
    announced: '2022-02-28'
    terminated: '2023-05-04'
    value-usd-billions: 13.4
    structure: All-cash, $25.00 per share
    termination-fee-usd-millions: 225
    additional-reimbursement-usd-millions: 25
    reason: >-
      Regulatory uncertainty around the timeline for receiving the required
      U.S. and Canadian bank-regulatory approvals; TD could not predict when
      approvals would be obtained, and the parties mutually agreed the deal
      would not close in a commercially reasonable timeframe. The termination
      announcement followed a year of heightened regulator scrutiny across
      large bank M&A and TD's own AML compliance issues, which later resulted
      in a $3B+ U.S. AML settlement in 2024.
