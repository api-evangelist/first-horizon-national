aid: first-horizon-national
name: First Horizon Corporation
description: >-
  First Horizon Corporation (NYSE: FHN), headquartered in Memphis, Tennessee,
  is a regional financial-services holding company operating across 12
  southeastern U.S. states through its principal subsidiary, First Horizon
  Bank. The franchise reports roughly $84 billion in total assets, $67 billion
  in deposits, and approximately 410 banking centers as of Q1 2026. Business
  lines include consumer and small-business banking, commercial and specialty
  lending, private banking and wealth management, and FHN Financial fixed-
  income capital markets. The company was founded in 1864 as First National
  Bank of Memphis, rebranded as First Tennessee in 1977, became First Horizon
  National Corporation in 2004, and shortened its name to First Horizon
  Corporation following the 2020 IberiaBank merger. In February 2022 First
  Horizon announced a $13.4 billion all-cash acquisition by Toronto-Dominion
  Bank; the parties mutually terminated the merger on May 4, 2023, citing
  regulatory uncertainty around the deal's closing timeline, with TD paying
  a $225 million termination fee plus a previously agreed $25 million
  reimbursement to First Horizon. First Horizon does not publish a public
  developer API portal. Customer account data is reachable for fintech use
  cases only through US open-banking aggregators (Plaid, MX, Finicity, Akoya)
  and through emerging Financial Data Exchange (FDX) APIs that will be
  required of covered data providers under the CFPB Section 1033 Personal
  Financial Data Rights rule. Commercial APIs for treasury management, ACH
  origination, wire initiation, and host-to-host file transfer are available
  to corporate clients under direct contract through First Horizon Treasury
  Management Services but are not publicly documented.
